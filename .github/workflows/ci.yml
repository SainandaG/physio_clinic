name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: srini_physio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/srini_physio_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v

  production-image:
    name: Production image smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: srini_physio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the image Render deploys
        run: docker build -t srini-physio .
      - name: Start it the way Render does
        run: |
          docker run -d --name app --network host \
            -e PORT=8000 \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/srini_physio \
            -e SECRET_KEY=ci-secret \
            -e ADMIN_EMAIL=admin@sriniphysio.com \
            -e ADMIN_PASSWORD=Ci-Admin-123 \
            srini-physio
      - name: Smoke test
        env:
          SMOKE_ADMIN_EMAIL: admin@sriniphysio.com
          SMOKE_ADMIN_PASSWORD: Ci-Admin-123
          SMOKE_WAIT: "60"
        run: python3 scripts/smoke_test.py http://localhost:8000
      - name: Container logs
        if: always()
        run: docker logs app
